<header class="bg-white dark:bg-gray-800 shadow-md">
  <div class="container mx-auto px-4 py-3">
    <div class="flex justify-between items-center">
      <!-- Logo y título -->
      <div class="flex items-center space-x-2">
        <a routerLink="/" class="flex items-center">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-primary-600 dark:text-primary-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253" />
          </svg>
          <span class="text-xl font-bold text-gray-900 dark:text-white ml-2">BiblioSystem</span>
        </a>
      </div>

      <!-- Navegación principal - Escritorio -->
      <nav class="hidden md:flex space-x-6">
        <a routerLink="/catalog" class="text-gray-700 dark:text-gray-300 hover:text-primary-600 dark:hover:text-primary-400 font-medium">Catálogo</a>
        <a *ngIf="isLoggedIn" routerLink="/loans" class="text-gray-700 dark:text-gray-300 hover:text-primary-600 dark:hover:text-primary-400 font-medium">Mis Préstamos</a>
        <a *ngIf="isLoggedIn" routerLink="/reservations" class="text-gray-700 dark:text-gray-300 hover:text-primary-600 dark:hover:text-primary-400 font-medium">Mis Reservas</a>
        <a *ngIf="isLoggedIn && isStaff" routerLink="/admin" class="text-gray-700 dark:text-gray-300 hover:text-primary-600 dark:hover:text-primary-400 font-medium">Administración</a>
      </nav>

      <!-- Botones de acción -->
      <div class="flex items-center space-x-4">
        <!-- Botón de modo oscuro -->
        <button (click)="toggleDarkMode()" class="p-2 rounded-full hover:bg-gray-200 dark:hover:bg-gray-700 focus:outline-none" aria-label="Toggle dark mode">
          <svg *ngIf="!isDarkMode" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-gray-700 dark:text-gray-300" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
          </svg>
          <svg *ngIf="isDarkMode" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-gray-700 dark:text-gray-300" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" />
          </svg>
        </button>

        <!-- Botones de autenticación -->
        <ng-container *ngIf="!isLoggedIn; else userMenu">
          <a routerLink="/auth/login" class="hidden md:inline-block px-4 py-2 text-gray-700 dark:text-gray-300 hover:text-primary-600 dark:hover:text-primary-400 font-medium">Iniciar sesión</a>
          <a routerLink="/auth/register" class="hidden md:inline-block px-4 py-2 bg-primary-600 hover:bg-primary-700 text-white font-medium rounded-md">Registrarse</a>
        </ng-container>

        <!-- Menú de usuario -->
        <ng-template #userMenu>
          <div class="relative">
            <button (click)="toggleMenu()" class="flex items-center space-x-2 focus:outline-none">
              <div class="w-8 h-8 rounded-full bg-primary-500 flex items-center justify-center text-white font-medium">U</div>
              <span class="hidden md:inline-block text-gray-700 dark:text-gray-300">Usuario</span>
              <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-gray-700 dark:text-gray-300" viewBox="0 0 20 20" fill="currentColor">
                <path fill-rule="evenodd" d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z" clip-rule="evenodd" />
              </svg>
            </button>

            <!-- Menú desplegable -->
            <div *ngIf="isMenuOpen" class="absolute right-0 mt-2 w-48 bg-white dark:bg-gray-800 rounded-md shadow-lg py-1 z-10">
              <a routerLink="/profile" class="block px-4 py-2 text-gray-700 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700">Mi Perfil</a>
              <a routerLink="/dashboard" class="block px-4 py-2 text-gray-700 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700">Dashboard</a>
              <button (click)="logout()" class="w-full text-left px-4 py-2 text-gray-700 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700">Cerrar sesión</button>
            </div>
          </div>
        </ng-template>

        <!-- Botón de menú móvil -->
        <button (click)="toggleMenu()" class="md:hidden p-2 rounded-md hover:bg-gray-200 dark:hover:bg-gray-700 focus:outline-none">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-gray-700 dark:text-gray-300" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
          </svg>
        </button>
      </div>
    </div>

    <!-- Menú móvil -->
    <div *ngIf="isMenuOpen" class="md:hidden mt-4 pb-4">
      <nav class="flex flex-col space-y-3">
        <a routerLink="/catalog" class="text-gray-700 dark:text-gray-300 hover:text-primary-600 dark:hover:text-primary-400 font-medium">Catálogo</a>
        <a *ngIf="isLoggedIn" routerLink="/loans" class="text-gray-700 dark:text-gray-300 hover:text-primary-600 dark:hover:text-primary-400 font-medium">Mis Préstamos</a>
        <a *ngIf="isLoggedIn" routerLink="/reservations" class="text-gray-700 dark:text-gray-300 hover:text-primary-600 dark:hover:text-primary-400 font-medium">Mis Reservas</a>
        <a *ngIf="isLoggedIn && isStaff" routerLink="/admin" class="text-gray-700 dark:text-gray-300 hover:text-primary-600 dark:hover:text-primary-400 font-medium">Administración</a>
        
        <ng-container *ngIf="!isLoggedIn">
          <a routerLink="/auth/login" class="text-gray-700 dark:text-gray-300 hover:text-primary-600 dark:hover:text-primary-400 font-medium">Iniciar sesión</a>
          <a routerLink="/auth/register" class="inline-block px-4 py-2 bg-primary-600 hover:bg-primary-700 text-white font-medium rounded-md">Registrarse</a>
        </ng-container>
      </nav>
    </div>
  </div>
</header>
