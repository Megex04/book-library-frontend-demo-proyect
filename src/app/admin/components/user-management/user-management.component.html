<div class="container mx-auto p-6">
  <div class="flex justify-between items-center mb-6">
    <h1 class="text-2xl font-bold text-gray-900 dark:text-white">Gestión de Usuarios</h1>
    <button mat-raised-button color="primary" (click)="addUser()" class="flex items-center">
      <mat-icon class="mr-2">add</mat-icon>
      Nuevo Usuario
    </button>
  </div>

  <div class="bg-white dark:bg-gray-800 rounded-lg shadow-md p-6 mb-6">
    <div class="flex items-center mb-4">
      <mat-form-field appearance="outline" class="flex-grow">
        <mat-label>Buscar usuarios</mat-label>
        <input matInput [(ngModel)]="searchTerm" (keyup)="applyFilter()" placeholder="Buscar por nombre, email, rol o estado">
        <mat-icon matPrefix class="mr-2 text-gray-400">search</mat-icon>
        <button *ngIf="searchTerm" matSuffix mat-icon-button aria-label="Clear" (click)="clearSearch()">
          <mat-icon>close</mat-icon>
        </button>
      </mat-form-field>
    </div>

    <div class="overflow-x-auto">
      <table mat-table [dataSource]="filteredData" class="w-full">
        <!-- ID Column -->
        <ng-container matColumnDef="id">
          <th mat-header-cell *matHeaderCellDef class="text-gray-700 dark:text-gray-300"> ID </th>
          <td mat-cell *matCellDef="let user"> {{user.id}} </td>
        </ng-container>

        <!-- Name Column -->
        <ng-container matColumnDef="name">
          <th mat-header-cell *matHeaderCellDef class="text-gray-700 dark:text-gray-300"> Nombre </th>
          <td mat-cell *matCellDef="let user"> {{user.name}} </td>
        </ng-container>

        <!-- Email Column -->
        <ng-container matColumnDef="email">
          <th mat-header-cell *matHeaderCellDef class="text-gray-700 dark:text-gray-300"> Email </th>
          <td mat-cell *matCellDef="let user"> {{user.email}} </td>
        </ng-container>

        <!-- Role Column -->
        <ng-container matColumnDef="role">
          <th mat-header-cell *matHeaderCellDef class="text-gray-700 dark:text-gray-300"> Rol </th>
          <td mat-cell *matCellDef="let user"> 
            <span class="px-2 py-1 text-xs rounded-full" [ngClass]="getRoleClass(user.role)">
              {{user.role}}
            </span>
          </td>
        </ng-container>

        <!-- Status Column -->
        <ng-container matColumnDef="status">
          <th mat-header-cell *matHeaderCellDef class="text-gray-700 dark:text-gray-300"> Estado </th>
          <td mat-cell *matCellDef="let user"> 
            <span class="px-2 py-1 text-xs rounded-full" [ngClass]="getStatusClass(user.status)">
              {{user.status}}
            </span>
          </td>
        </ng-container>

        <!-- Last Login Column -->
        <ng-container matColumnDef="lastLogin">
          <th mat-header-cell *matHeaderCellDef class="text-gray-700 dark:text-gray-300"> Último Acceso </th>
          <td mat-cell *matCellDef="let user"> {{user.lastLogin}} </td>
        </ng-container>

        <!-- Actions Column -->
        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef class="text-gray-700 dark:text-gray-300"> Acciones </th>
          <td mat-cell *matCellDef="let user"> 
            <button mat-icon-button [matMenuTriggerFor]="menu" aria-label="Acciones de usuario">
              <mat-icon>more_vert</mat-icon>
            </button>
            <mat-menu #menu="matMenu">
              <button mat-menu-item (click)="viewUserDetails(user)">
                <mat-icon>visibility</mat-icon>
                <span>Ver detalles</span>
              </button>
              <button mat-menu-item (click)="editUser(user)">
                <mat-icon>edit</mat-icon>
                <span>Editar</span>
              </button>
              <button mat-menu-item (click)="deleteUser(user)">
                <mat-icon>delete</mat-icon>
                <span>Eliminar</span>
              </button>
            </mat-menu>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

        <!-- Row shown when there is no matching data. -->
        <tr class="mat-row" *matNoDataRow>
          <td class="mat-cell py-4 text-center text-gray-500 dark:text-gray-400" [attr.colspan]="displayedColumns.length">
            No se encontraron usuarios que coincidan con "{{searchTerm}}"
          </td>
        </tr>
      </table>
    </div>

    <mat-paginator [pageSizeOptions]="[5, 10, 25, 100]" aria-label="Seleccionar página de usuarios">
    </mat-paginator>
  </div>
</div>
